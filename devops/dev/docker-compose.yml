# Dev environment, started by deploy.sh on the server. Secrets come from devops/dev/.env.
services:
  oppocr-web:
    image: ${IMAGE_NAME:-oppocr-web}:${IMAGE_TAG:?IMAGE_TAG is set by deploy.sh}
    pull_policy: never
    container_name: ${CONTAINER_NAME:-oppocr-dev}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOCS_EDITOR_INTERNAL_URL: http://documentserver
      DOCS_EDITOR_APP_URL: http://oppocr-web:8080
      DOCS_STORAGE_PATH: /app/data/documents
    volumes:
      - documents:/app/data
    ports:
      - "${APP_PORT:-5286}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  documentserver:
    image: onlyoffice/documentserver:9.4.0.1
    container_name: ${CONTAINER_NAME:-oppocr-dev}-docs
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${DOCS_EDITOR_JWT_SECRET:?DOCS_EDITOR_JWT_SECRET is missing in devops/dev/.env; run ./devops/dev/setup.sh}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - docs-data:/var/www/onlyoffice/Data
    ports:
      - "${DOCS_PORT:-8085}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  documents:
  docs-data:
